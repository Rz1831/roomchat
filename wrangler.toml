name = "lumiere-salon"
main = "worker.js"
compatibility_date = "2025-01-01"

# Local development database (wrangler dev --local).
[[d1_databases]]
binding = "DB"
database_name = "lumiere-salon"
database_id = "00000000-0000-0000-0000-0000000000a1"

[vars]
# Telegram chat that receives a message for every new booking.
# The bot token itself is a secret (TELEGRAM_BOT_TOKEN), never in this file.
TELEGRAM_CHAT_ID = "5433551250"
SALON_NAME = "LUMIÈRE Hair Salon"
SALON_EMAIL = "hello@lumiere-salon.com"
SALON_PHONE = "+1 (323) 555-0184"
SALON_ADDRESS = "1428 Abbot Kinney Blvd, Los Angeles, CA 90291"

# 15:00 UTC ≈ 08:00 in Los Angeles — the daily schedule message.
[triggers]
crons = ["0 15 * * *"]
