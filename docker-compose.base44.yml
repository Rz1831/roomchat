services:
  web:
    image: node:22
    working_dir: /workspace
    command:
      - sh
      - -ec
      - |
        if [ ! -d node_modules/wrangler ]; then
          npm install --no-audit --no-fund
        fi
        npx wrangler d1 execute lumiere-salon --local --file=./schema.sql
        npx wrangler d1 execute lumiere-salon --local --file=./seed.sql
        exec npx wrangler dev --port 3000 --ip 0.0.0.0 --local --show-interactive-dev-session=false
    volumes:
      - "${BASE44_PROJECT_ROOT}:/workspace"
    ports:
      - "3000:3000"
    environment:
      - BASE44_PREVIEW_MODE
      - CI=1
      - WRANGLER_SEND_METRICS=false
    env_file:
      - /run/base44/app.env
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s
    restart: on-failure
